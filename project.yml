name: ZontesRider
options:
  bundleIdPrefix: com.shiqixiaoyao
targets:
  ZontesRider:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZontesRider
        excludes:
          - "Info.plist"
    info:
      path: ZontesRider/Info.plist
      properties:
        CFBundleDisplayName: 升仕车机
        # 版本号写死：XcodeGen 不会把 MARKETING_VERSION 自动写进 Info.plist，
        # 之前包内一直是 SDK 默认的 1.0/1，装完根本分不清装的是哪一版。
        CFBundleShortVersionString: "0.2.2"
        CFBundleVersion: "8"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: 需要蓝牙连接升仕车机，用于读取车况数据与执行控车指令
        ITSAppUsesNonExemptEncryption: false
        # ifino 网关跑在 8081 端口、TLS 配置老旧，ATS 会直接掐断请求（表现为登录无响应）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiqixiaoyao.zontesrider
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "8"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # ↓↓↓ 抗闪退关键 1/2：把 Swift 运行时随包带。
        # 用较新 Xcode（SDK iOS 26）编译、部署目标却是 iOS 17 时，二进制里对
        # /usr/lib/swift/libswiftCore.dylib 等是**绝对路径**引用，会去加载**系统**的那份；
        # 若编译器在新系统符号上产生强引用，旧 iOS 上就是 dyld 失败 → 点开图标即闪退。
        # 打开此项后 linker 改用 @rpath 引用并把 libswift*.dylib 嵌进 .app/Frameworks，
        # 符号由 App 自带，不再依赖设备系统版本。
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
