name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Release
        run: |
          xcodebuild \
            -project ZontesRider.xcodeproj \
            -scheme ZontesRider \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/DerivedData/Build/Products/Release-iphoneos/ZontesRider.app" build/Payload/
          cd build
          zip -r -q ZontesRider-unsigned.ipa Payload
          ls -lh ZontesRider-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZontesRider-unsigned-ipa
          path: build/ZontesRider-unsigned.ipa
          retention-days: 30
