name: ZontesRider
options:
  bundleIdPrefix: com.shiqixiaoyao
targets:
  ZontesRider:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZontesRider
        excludes:
          - "Info.plist"
    info:
      path: ZontesRider/Info.plist
      properties:
        CFBundleDisplayName: 升仕车机
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: 需要蓝牙连接升仕车机，用于读取车况数据与执行控车指令
        ITSAppUsesNonExemptEncryption: false
        # ifino 网关跑在 8081 端口、TLS 配置老旧，ATS 会直接掐断请求（表现为登录无响应）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiqixiaoyao.zontesrider
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1,2"
