name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ═════════════════════════════════════════════════════════════
  # 作业 0：协议解析离线自检（不联网、不装模拟器，十几秒跑完）
  #
  # 2026-09-30 的线上故障「响应解析失败：Key 'code' not found ... Path: data」
  # 根因是 getHomeData 把泛型实参写成 Envelope<HomeDataPayload>，与 perform 内部
  # 的包膜叠加成双层包膜。两层都是 Decodable，**编译器拦不住**，
  # 只能在真机上装包 → 登录 → 才暴露，一轮十几分钟。
  #
  # 这里用真实抓取、脱敏后的响应接上 URLProtocol 打桩，把客户端真实代码路径
  # （perform → decodePayload → DTO）完整跑一遍并断言字段值。
  # 该作业失败会**卡住出包**（build 依赖它），保证不再把这类 bug 发到手机上。
  # ═════════════════════════════════════════════════════════════
  decode-check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 编译并运行协议解析自检
        run: |
          set -o pipefail
          mkdir -p build
          xcrun swiftc -swift-version 5 -parse-as-library \
            ZontesRider/Model/VehicleTelemetry.swift \
            ZontesRider/Model/TrackPoint.swift \
            ZontesRider/Services/Net/IfinoAPI.swift \
            ZontesRider/Services/Store/LocalStore.swift \
            ZontesRider/Services/BLE/BLEConstants.swift \
            Tools/decode_check/main.swift \
            -o build/decode_check
          ./build/decode_check Tools/decode_check/Fixtures

  # ═════════════════════════════════════════════════════════════
  # 作业 1：模拟器冒烟测试
  #
  # 这是本轮最关键的诊断手段。iOS 模拟器**完全不涉及**签名/描述文件/
  # 证书/AltStore，所以：
  #   · 模拟器里就崩  → 是 ZontesRider 的代码问题，日志会直接给出原因
  #   · 模拟器里不崩  → 代码没问题，闪退出在签名/装机/证书这条链路上
  # 同时把应用程序容器里的 launch.phase.txt / last-crash.txt 抓出来，
  # 那是我们自己写的"死在第几步"证据。
  # ═════════════════════════════════════════════════════════════
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          PICK=""
          for v in 16.4 16.3 16.2 16.1 16.0 15.4; do
            if [ -d "/Applications/Xcode_$v.app" ]; then PICK="/Applications/Xcode_$v.app"; break; fi
          done
          if [ -z "$PICK" ]; then
            PICK="$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v 'Xcode_26' | head -1 || true)"
          fi
          if [ -z "$PICK" ]; then PICK="$(ls -d /Applications/Xcode*.app 2>/dev/null | head -1)"; fi
          echo "选中: $PICK"
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available | head -30
          UDID=$(xcrun simctl list devices available | grep -E 'iPhone' | head -1 | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' | head -1)
          echo "udid=$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # ⚠️ 必须用 Release。
      # Xcode 16 的 Debug 配置会启用 "Debug Dylib"：主可执行文件变成一个
      # 只负责加载 <App>.debug.dylib 的桩，并链上 libPreviewsJITStubExecutor。
      # 这种产物用 simctl 在 Xcode 之外启动会直接失败（与 App 代码无关），
      # 会污染判断。Release 才和真正发给用户的包同构。
      - name: Build for simulator (Release)
        run: |
          set -o pipefail
          for T in ZontesRider ZontesMinimal; do
            echo "════════ sim build $T ════════"
            xcodebuild \
              -project ZontesRider.xcodeproj \
              -scheme "$T" \
              -configuration Release \
              -sdk iphonesimulator \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath build/sim \
              build 2>&1 | tee "sim-$T.log" | tail -20
            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "════ sim 编译错误 $T ════"
              grep -E "error:|\.swift:[0-9]+:[0-9]+: error" "sim-$T.log" | head -40
              exit ${PIPESTATUS[0]}
            fi
          done

      - name: Inspect app bundle and ad-hoc sign
        run: |
          set +e
          for T in ZontesRider ZontesMinimal; do
            APP="build/sim/Build/Products/Release-iphonesimulator/$T.app"
            echo "════════ $T 产物检查 ════════"
            ls -la "$APP"
            echo "--- file ---"
            file "$APP/$T"
            echo "--- 是否带 code signature ---"
            otool -l "$APP/$T" 2>/dev/null | grep -c LC_CODE_SIGNATURE
            echo "--- 现有签名 ---"
            codesign -dv --verbose=2 "$APP" 2>&1 | head -12
            echo "--- 强制做一次全新 ad-hoc 签名（模拟 AltStore 重签这一动作）---"
            codesign --force --deep --sign - "$APP" 2>&1 | head -8
            echo "--- 校验签名 ---"
            codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | head -12
            echo "--- 签名后权限 ---"
            ls -la "$APP/$T"
          done
          exit 0

      - name: Boot simulator and install
        run: |
          set +e
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b || true
          for T in ZontesRider ZontesMinimal; do
            BID=$( [ "$T" = "ZontesRider" ] && echo com.shiqixiaoyao.zontesrider || echo com.shiqixiaoyao.zontesminimal )
            APP="build/sim/Build/Products/Release-iphonesimulator/$T.app"
            xcrun simctl uninstall "$UDID" "$BID" 2>/dev/null || true
            echo "── 安装 $T ──"
            xcrun simctl install "$UDID" "$APP"
            echo "install rc=$?"
            echo "── 安装后容器里的可执行文件权限 ──"
            CTR=$(xcrun simctl get_app_container "$UDID" "$BID" app 2>&1)
            echo "container: $CTR"
            ls -la "$CTR" 2>/dev/null
            stat -f "%Sp %N" "$CTR/$T" 2>/dev/null || echo "(取不到)"
          done
          exit 0

      - name: Launch and observe
        run: |
          exec > >(tee sim-report.txt 2>&1) 2>&1
          set +e
          UDID="${{ steps.sim.outputs.udid }}"
          SMOKE_FAIL=0

          # 用普通 launch（不用 --console-pty）：它会返回 pid 或明确报错，
          # 上一次用 --console-pty 判断"存活"是错的——那个进程一直挂着，
          # 哪怕 App 早就 spawn 失败被杀掉了。
          for T in ZontesRider ZontesMinimal; do
            BID=$( [ "$T" = "ZontesRider" ] && echo com.shiqixiaoyao.zontesrider || echo com.shiqixiaoyao.zontesminimal )
            echo "════════════════════════════════"
            echo "  测试 $T ($BID)"
            echo "════════════════════════════════"
            # ZontesRider 带探针启动：自动遍历五个工段（页面级崩溃只有在切页时才暴露）
            if [ "$T" = "ZontesRider" ]; then
              WAIT=25
              OUT=$(SIMCTL_CHILD_ZR_PROBE=1 xcrun simctl launch "$UDID" "$BID" 2>&1)
            else
              WAIT=8
              OUT=$(xcrun simctl launch "$UDID" "$BID" 2>&1)
            fi
            RC=$?
            echo "launch rc=$RC"
            echo "$OUT"
            sleep $WAIT
            echo "── 进程是否还在 ──"
            ALIVE=1
            if xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -qi "$BID"; then
              echo "✅ $T 存活"
            else
              echo "❌ $T 已退出（spawn 失败或启动即崩）"
              ALIVE=0
            fi
            echo "── 容器内的启动轨迹 ──"
            C=$(xcrun simctl get_app_container "$UDID" "$BID" data 2>/dev/null)
            PHASE=$(cat "$C/Documents/launch.phase.txt" 2>/dev/null || echo 无)
            echo "phase: $PHASE"
            echo "crash: $(cat "$C/Documents/last-crash.txt" 2>/dev/null || echo 无)"

            # ⚠️ 这一段的判失败逻辑是补上来的：
            #   原来只 echo ❌ 就 exit 0 —— 于是「App 崩了」也能一路绿灯出包，
            #   和我们自己立的「不再有任何假成功」相矛盾。
            if [ "$ALIVE" = "0" ]; then
              echo "::error::$T 在启动/探针期间退出（进程已不在）"
              SMOKE_FAIL=1
            fi
            if [ "$T" = "ZontesRider" ]; then
              case "$PHASE" in
                probe.done)
                  echo "✅ 探针跑完：五个工段逐个渲染过，无页面级崩溃"
                  ;;
                probe.*)
                  echo "::error::页面级崩溃：探针停在 phase=$PHASE（对应工段编号见 RootView.AppTab 顺序 0仪表/1轨迹/2油耗/3车况/4我的）"
                  SMOKE_FAIL=1
                  ;;
                *)
                  echo "⚠️ 探针未跑起来（phase=$PHASE）—— 检查 SIMCTL_CHILD_ZR_PROBE 是否透传"
                  ;;
              esac
            fi
            echo ""
          done

          echo "══════════ 模拟器崩溃报告 ══════════"
          find ~/Library/Logs/DiagnosticReports -name "*Zontes*" 2>/dev/null | head
          for f in $(find ~/Library/Logs/DiagnosticReports -name "*Zontes*" 2>/dev/null | head -3); do
            echo "--- $f ---"
            head -70 "$f"
          done

          echo "══════════ 系统日志（启动失败原因）══════════"
          xcrun simctl spawn "$UDID" log show --last 4m --style compact 2>/dev/null \
            | grep -iE "zontes|posix_spawn|spawn failed|posix|amfi|codesign|dyld|Fatal error|uncaught|Termination|EXC_|launchd_sim" \
            | tail -120

          if [ "$SMOKE_FAIL" = "1" ]; then
            echo "::error::冒烟测试判定失败：见上面的 ::error:: 行"
            exit 1
          fi
          exit 0

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-smoke-logs
          path: sim-report.txt
          retention-days: 30
          if-no-files-found: warn

  # ═════════════════════════════════════════════════════════════
  # 作业 2：出两个未签名 IPA
  #   · ZontesRider —— 主包
  #   · ZontesMinimal —— 最小复现包（全新 bundle id，零依赖）
  # 两个都装一次，就能判定问题在代码还是在签名链路。
  # ═════════════════════════════════════════════════════════════
  build:
    needs: [decode-check]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 抗闪退关键：钉住工具链。
      # latest-stable 实为 Xcode 26 / SDK iOS 26.2，产物在 iOS 17/18 真机上
      # 点开即闪退；Xcode 16.x（SDK iOS 18）编译的包在 iOS 17+ 上最稳。
      - name: Select Xcode
        run: |
          PICK=""
          for v in 16.4 16.3 16.2 16.1 16.0 15.4; do
            if [ -d "/Applications/Xcode_$v.app" ]; then PICK="/Applications/Xcode_$v.app"; break; fi
          done
          if [ -z "$PICK" ]; then
            PICK="$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v 'Xcode_26' | head -1 || true)"
          fi
          if [ -z "$PICK" ]; then PICK="$(ls -d /Applications/Xcode*.app 2>/dev/null | head -1)"; fi
          echo "选中: $PICK"
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned Release (both targets)
        run: |
          set -o pipefail
          for T in ZontesRider ZontesMinimal; do
            echo "════════ 构建 $T ════════"
            xcodebuild \
              -project ZontesRider.xcodeproj \
              -scheme "$T" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              IPHONEOS_DEPLOYMENT_TARGET=17.0 \
              ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
              build 2>&1 | tee "build-$T.log" | tail -40
            # 编译失败时把真正的 error 行抓出来（tail 会把 error 淹没在 warning 之后）
            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "════ 编译错误详情 $T ════"
              grep -nE "error|\.swift:[0-9]+:[0-9]+" "build-$T.log" | grep -viE "warning|##\[error\]|following build commands|CompileSwift|Building project|SwiftDriver" | head -60
              exit ${PIPESTATUS[0]}
            fi
          done

      - name: Verify bundles
        run: |
          for T in ZontesRider ZontesMinimal; do
            APP="build/DerivedData/Build/Products/Release-iphoneos/$T.app"
            echo "════════ $T ════════"
            ls -la "$APP"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms" "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Print :LSRequiresIPhoneOS" "$APP/Info.plist" || true
            lipo -info "$APP/$T" 2>/dev/null || file "$APP/$T"
          done

      - name: Package unsigned IPAs
        run: |
          set -e
          cd build
          for T in ZontesRider ZontesMinimal; do
            SRC="DerivedData/Build/Products/Release-iphoneos/$T.app"
            # 显式确认可执行位（丢了的话设备上 posix_spawn 会直接 EACCES，
            # 表现就是点图标立刻弹回桌面）
            chmod +x "$SRC/$T"
            echo "── $T 二进制权限/签名 ──"
            stat -f "%Sp %N" "$SRC/$T"
            # grep -c 在匹配 0 行时返回 1，会误杀 set -e 的整个打包步骤，必须兜住
            otool -l "$SRC/$T" | grep -c LC_CODE_SIGNATURE || echo "0（未签名，符合预期：留给自签工具重签）"
            rm -rf pkg && mkdir -p pkg/Payload
            cp -r "$SRC" pkg/Payload/
            (cd pkg && zip -r -q "../$T-unsigned.ipa" Payload)
            ls -lh "$T-unsigned.ipa"
          done

      - name: Upload ZontesRider IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZontesRider-unsigned-ipa
          path: build/ZontesRider-unsigned.ipa
          retention-days: 30

      - name: Upload ZontesMinimal IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZontesMinimal-unsigned-ipa
          path: build/ZontesMinimal-unsigned.ipa
          retention-days: 30
